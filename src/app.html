<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Cramber Hub</title>
        <script>
            (() => {
                try {
                    let mode = localStorage.getItem('cramber-theme') || 'dark';
                    if (mode === 'system')
                        mode = matchMedia('(prefers-color-scheme: light)').matches
                            ? 'light'
                            : 'dark';
                    document.documentElement.dataset.theme = mode;
                } catch {}
            })();
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
